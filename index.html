<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Estudos</title>
    <style>
        .card {
                display: flex;
                    flex-direction: column;
                        align-items: center;
                            justify-content: center;
                                min-height: 150px;
                                    padding: 24px 16px;
                                        background: #ffffff;
                                            color: #40533a;
                                                border: 1px solid #e0e5d9;
                                                    border-radius: 18px;
                                                        text-decoration: none;
                                                            text-align: center;
                                                                box-shadow: 0 4px 12px #26351a0d;
                                                                    margin-bottom: 16px;
                                                                    }

                                                                    .icone {
                                                                        font-size: 34px;
                                                                            margin-bottom: 12px;
                                                                            }

                                                                            .nome {
                                                                                font-size: 17px;
                                                                                    font-weight: bold;
                                                                                    }

                                                                                    .detalhe {
                                                                                        font-size: 14px;
                                                                                            color: #687064;
                                                                                                margin-top: 6px;
                                                                                                }
        }
                            body {
                                    font-family: Arial, sans-serif;
                                            background: #f5f6f1;
                                                    color: #30382d;
                                                            margin: 0;
                                                                    padding: 30px 20px;
                                                                        }

                                                                            h1 {
                                                                                    color: #40533a;
                                                                                            text-align: center;
                                                                                                    font-size: 30px;
                                                                                                            margin-bottom: 10px;
                                                                                                                }

                                                                                                                    p {
                                                                                                                            text-align: center;
                                                                                                                                    color: #687064;
                                                                                                                                            line-height: 1.6;
                                                                                                                                                }

                                                                                                                                                    a {
                                                                                                                                                            text-decoration: none;
                                                                                                                                                                }

                                                                                                                                                                    a:has(button) {
                                                                                                                                                                            display: block;
                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                        }

                                                                                                                                                                                            button {
                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                            min-height: 100px;
                                                                                                                                                                                                                    padding: 22px 16px;
                                                                                                                                                                                                                            background: #ffffff;
                                                                                                                                                                                                                                    color: #40533a;
                                                                                                                                                                                                                                            border: 1px solid #e0e5d9;
                                                                                                                                                                                                                                                    border-radius: 16px;
                                                                                                                                                                                                                                                            font-size: 17px;
                                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                                                            box-shadow: 0 3px 10px #26351a0d;
                                                                                                                                                                                                                                                                                                    transition: 0.2s;
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                            button:hover {
                                                                                                                                                                                                                                                                                                                    background: #e9eee3;
                                                                                                                                                                                                                                                                                                                            border-color: #718365;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                    a:has(button) {
                                                                                                                                                                                                                                                                                                                                            margin-bottom: 14px;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                    body > a:last-of-type {
                                                                                                                                                                                                                                                                                                                                                            color: #40533a;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                    @media (min-width: 600px) {
                                                                                                                                                                                                                                                                                                                                                                            body {
                                                                                                                                                                                                                                                                                                                                                                                        max-width: 900px;
                                                                                                                                                                                                                                                                                                                                                                                                    margin: 0 auto;
                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                    body {
                                                                                                                                                                                                                                                                                                                                                                                                                                display: grid;
                                                                                                                                                                                                                                                                                                                                                                                                                                            grid-template-columns: repeat(2, minmax(0, 1fr));
                                                                                                                                                                                                                                                                                                                                                                                                                                                        gap: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        h1, p {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    grid-column: 1 / -1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
</head>
<body>
    <h1>📚 Portal de Estudos</h1>
    <p>Bem-vindos ao nosso espaço de estudos da faculdade!</p>
    <h2>Matérias</h2>
    <a href="frontend/administrativo.html">
            <button>
                    ⚖️<br>
                            Direito Administrativo<br>
                                    <small>Parte Geral</small>
                                        </button>
                                            <a href="frontend/civil.html" class="card">
                                                    <span class="icone">📘</span>
                                                        <span class="nome">Direito Civil</span>
                                                            <span class="detalhe">Contratos</span>
                                                            </a>
    <a href="frontend/trabalho.html">
    <button>Direito do Trabalho</button>
    </a>
        <a href="frontend/penal.html">
    <button>Direito Penal — Legislação Extravagante</button>
        </a>
        <a href="frontend/processo-civil.html">
    <a href="frontend/processo-civil.html">
    <button>Processo Civil — Teoria Geral</button>
    </a>
</body>
</html>
